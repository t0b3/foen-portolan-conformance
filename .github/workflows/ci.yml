name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: GDAL for the COG fixtures
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin
      - name: Install
        run: |
          uv venv .venv
          uv pip install --python .venv -e ".[parquet,dev]"
      - name: Ruff
        run: .venv/bin/ruff check . && .venv/bin/ruff format --check .
      - name: Unit tests (no external validators needed)
        run: .venv/bin/pytest -m "not tools" -q
